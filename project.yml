name: Kayoi
options:
  deploymentTarget:
    macOS: "26.0"
packages:
  Core:
    path: Packages/Core
  ADB:
    path: Packages/ADB
  AliyunDrive:
    path: Packages/AliyunDrive
  Quark:
    path: Packages/Quark
  S3Drive:
    path: Packages/S3Drive
  CloudDrive:
    path: Packages/CloudDrive
  RicohGR:
    path: Packages/RicohGR
  CameraUSB:
    path: Packages/CameraUSB
  PikPakDrive:
    path: Packages/PikPakDrive
  LanzouDrive:
    path: Packages/LanzouDrive
  TianyiDrive:
    path: Packages/TianyiDrive
  ChinaWebDrive:
    path: Packages/ChinaWebDrive
configFiles:
  Debug: ${KAYOI_BUILD_CONFIG}
  Release: ${KAYOI_BUILD_CONFIG}
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development: seaony@outlook.com"
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
targets:
  Kayoi:
    type: application
    platform: macOS
    sources:
      - App
      - path: README.md
        buildPhase: resources
      - path: docs/THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: docs/licenses
        buildPhase: resources
      - path: Packages/ADB/Vendor/BoringSSL/LICENSE
        buildPhase: resources
    dependencies:
      - package: Core
      - package: ADB
      - package: AliyunDrive
      - package: Quark
      - package: S3Drive
      - package: CloudDrive
      - package: RicohGR
      - package: CameraUSB
      - package: PikPakDrive
      - package: LanzouDrive
      - package: TianyiDrive
      - package: ChinaWebDrive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seaony.Kayoi
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Kayoi
        ALIYUN_CLIENT_ID: $(ALIYUN_CLIENT_ID)
        ALIYUN_CLIENT_SECRET: $(ALIYUN_CLIENT_SECRET)
        ALIYUN_REDIRECT_URI: $(ALIYUN_REDIRECT_URI)
        BAIDU_CLIENT_ID: $(BAIDU_CLIENT_ID)
        BAIDU_CLIENT_SECRET: $(BAIDU_CLIENT_SECRET)
        BAIDU_APP_ID: $(BAIDU_APP_ID)
        BAIDU_ROOT_PATH: $(BAIDU_ROOT_PATH)
        BAIDU_REDIRECT_URI: $(BAIDU_REDIRECT_URI)
        DRIVE115_CLIENT_ID: $(DRIVE115_CLIENT_ID)
        DRIVE115_CLIENT_SECRET: $(DRIVE115_CLIENT_SECRET)
        DRIVE115_REDIRECT_URI: $(DRIVE115_REDIRECT_URI)
        DRIVE123_CLIENT_ID: $(DRIVE123_CLIENT_ID)
        DRIVE123_CLIENT_SECRET: $(DRIVE123_CLIENT_SECRET)
        DRIVE123_REDIRECT_URI: $(DRIVE123_REDIRECT_URI)
        ONEDRIVE_CLIENT_ID: $(ONEDRIVE_CLIENT_ID)
        ONEDRIVE_REDIRECT_URI: $(ONEDRIVE_REDIRECT_URI)
        GOOGLE_CLIENT_ID: $(GOOGLE_CLIENT_ID)
        DROPBOX_CLIENT_ID: $(DROPBOX_CLIENT_ID)
        DROPBOX_REDIRECT_URI: $(DROPBOX_REDIRECT_URI)
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSCameraUsageDescription: 发现并读取通过 USB 连接的相机。
        NSLocalNetworkUsageDescription: 发现并连接局域网中的设备和共享。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            "10.0.0.0/8":
              NSExceptionAllowsInsecureHTTPLoads: true
            "172.16.0.0/12":
              NSExceptionAllowsInsecureHTTPLoads: true
            "192.168.0.0/16":
              NSExceptionAllowsInsecureHTTPLoads: true
            "127.0.0.0/8":
              NSExceptionAllowsInsecureHTTPLoads: true
            "169.254.0.0/16":
              NSExceptionAllowsInsecureHTTPLoads: true
            "fc00::/7":
              NSExceptionAllowsInsecureHTTPLoads: true
            "fe80::/10":
              NSExceptionAllowsInsecureHTTPLoads: true
            "::1":
              NSExceptionAllowsInsecureHTTPLoads: true
        NSBonjourServices: ["_smb._tcp", "_adb-tls-pairing._tcp", "_adb-tls-connect._tcp"]
        CFBundleURLTypes:
          - CFBundleURLName: com.seaony.Kayoi.oauth
            CFBundleURLSchemes: [kayoi]
  KayoiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/KayoiTests
      - App/Logic
      - App/AppModel.swift
    dependencies:
      - package: Core
      - package: ADB
      - package: AliyunDrive
      - package: Quark
      - package: S3Drive
      - package: CloudDrive
      - package: RicohGR
      - package: CameraUSB
      - package: PikPakDrive
      - package: LanzouDrive
      - package: TianyiDrive
      - package: ChinaWebDrive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seaony.Kayoi.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KayoiTests:
    build:
      targets:
        KayoiTests: all
    test:
      gatherCoverageData: true
      targets:
        - KayoiTests
  Kayoi:
    build:
      targets:
        Kayoi: all
