name: Kayoi
options:
  deploymentTarget:
    macOS: "26.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  Core:
    path: Packages/Core
  DevTool:
    path: Packages/DevTool
  ADB:
    path: Packages/ADB
  AliyunDrive:
    path: Packages/AliyunDrive
  Quark:
    path: Packages/Quark
  S3Drive:
    path: Packages/S3Drive
  CloudDrive:
    path: Packages/CloudDrive
  RicohGR:
    path: Packages/RicohGR
  CameraUSB:
    path: Packages/CameraUSB
  PikPakDrive:
    path: Packages/PikPakDrive
  LanzouDrive:
    path: Packages/LanzouDrive
  TianyiDrive:
    path: Packages/TianyiDrive
  ChinaWebDrive:
    path: Packages/ChinaWebDrive
configFiles:
  Debug: ${KAYOI_BUILD_CONFIG}
  Release: ${KAYOI_BUILD_CONFIG}
settings:
  base:
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: JJJKGPY7T7
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_APP_SANDBOX: NO
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES
targets:
  Kayoi:
    type: application
    platform: macOS
    sources:
      - App
      - FSShared
      - path: README.md
        buildPhase: resources
      - path: docs/THIRD_PARTY_NOTICES.md
        buildPhase: resources
      - path: docs/licenses
        buildPhase: resources
      - path: Packages/ADB/Vendor/BoringSSL/LICENSE
        buildPhase: resources
    dependencies:
      - target: KayoiFS
      - package: Sparkle
      - package: Core
      - package: DevTool
        product: DevToolSupport
      - package: ADB
      - package: AliyunDrive
      - package: Quark
      - package: S3Drive
      - package: CloudDrive
      - package: RicohGR
      - package: CameraUSB
      - package: PikPakDrive
      - package: LanzouDrive
      - package: TianyiDrive
      - package: ChinaWebDrive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seaony.Kayoi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Kayoi.entitlements
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Kayoi
        KayoiDevToolProtocolVersion: 1
        ALIYUN_CLIENT_ID: $(ALIYUN_CLIENT_ID)
        ALIYUN_CLIENT_SECRET: $(ALIYUN_CLIENT_SECRET)
        ALIYUN_REDIRECT_URI: $(ALIYUN_REDIRECT_URI)
        BAIDU_CLIENT_ID: $(BAIDU_CLIENT_ID)
        BAIDU_CLIENT_SECRET: $(BAIDU_CLIENT_SECRET)
        BAIDU_APP_ID: $(BAIDU_APP_ID)
        BAIDU_ROOT_PATH: $(BAIDU_ROOT_PATH)
        BAIDU_REDIRECT_URI: $(BAIDU_REDIRECT_URI)
        DRIVE115_CLIENT_ID: $(DRIVE115_CLIENT_ID)
        DRIVE115_CLIENT_SECRET: $(DRIVE115_CLIENT_SECRET)
        DRIVE115_REDIRECT_URI: $(DRIVE115_REDIRECT_URI)
        DRIVE123_CLIENT_ID: $(DRIVE123_CLIENT_ID)
        DRIVE123_CLIENT_SECRET: $(DRIVE123_CLIENT_SECRET)
        DRIVE123_REDIRECT_URI: $(DRIVE123_REDIRECT_URI)
        ONEDRIVE_CLIENT_ID: $(ONEDRIVE_CLIENT_ID)
        ONEDRIVE_REDIRECT_URI: $(ONEDRIVE_REDIRECT_URI)
        GOOGLE_CLIENT_ID: $(GOOGLE_CLIENT_ID)
        DROPBOX_CLIENT_ID: $(DROPBOX_CLIENT_ID)
        DROPBOX_REDIRECT_URI: $(DROPBOX_REDIRECT_URI)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://github.com/Seaony/Kayoi/releases/latest/download/appcast.xml
        SUPublicEDKey: FnPUWAEY6WKwo0yvQLOBvEt7xjuhAabwNu1Y9QalNQc=
        SURequireSignedFeed: true
        SUVerifyUpdateBeforeExtraction: true
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true
        NSCameraUsageDescription: 发现并读取通过 USB 连接的相机。
        NSLocalNetworkUsageDescription: 发现并连接局域网中的设备和共享。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            "10.0.0.0/8":
              NSExceptionAllowsInsecureHTTPLoads: true
            "172.16.0.0/12":
              NSExceptionAllowsInsecureHTTPLoads: true
            "192.168.0.0/16":
              NSExceptionAllowsInsecureHTTPLoads: true
            "127.0.0.0/8":
              NSExceptionAllowsInsecureHTTPLoads: true
            "169.254.0.0/16":
              NSExceptionAllowsInsecureHTTPLoads: true
            "fc00::/7":
              NSExceptionAllowsInsecureHTTPLoads: true
            "fe80::/10":
              NSExceptionAllowsInsecureHTTPLoads: true
            "::1":
              NSExceptionAllowsInsecureHTTPLoads: true
        NSBonjourServices: ["_smb._tcp", "_adb-tls-pairing._tcp", "_adb-tls-connect._tcp"]
        CFBundleURLTypes:
          - CFBundleURLName: com.seaony.Kayoi.oauth
            CFBundleURLSchemes: [kayoi]
  # FSKit 文件系统扩展：把远端位置挂成 Finder 里的卷
  KayoiFS:
    type: extensionkit-extension
    platform: macOS
    sources:
      - FSShared
      - path: App/InfoPlist.xcstrings
        buildPhase: resources
      - path: FSExtension
        excludes:
          - Info.plist
          - KayoiFS.entitlements
    dependencies:
      - package: Core
      - package: ADB
      - package: AliyunDrive
      - package: Quark
      - package: S3Drive
      - package: CloudDrive
      - package: CameraUSB
      - package: PikPakDrive
      - package: LanzouDrive
      - package: TianyiDrive
      - package: ChinaWebDrive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seaony.Kayoi.FS
        PRODUCT_NAME: KayoiFS
        INFOPLIST_FILE: FSExtension/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: FSExtension/KayoiFS.entitlements
        ENABLE_APP_SANDBOX: YES
  KayoiTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/KayoiTests
      - App/Logic
      - App/AppModel.swift
      - App/UpdateController.swift
      - FSExtension/RemoteVolume.swift
    dependencies:
      - package: Sparkle
      - package: Core
      - package: Core
        product: CoreTestSupport
      - package: ADB
      - package: AliyunDrive
      - package: Quark
      - package: S3Drive
      - package: CloudDrive
      - package: RicohGR
      - package: CameraUSB
      - package: PikPakDrive
      - package: LanzouDrive
      - package: TianyiDrive
      - package: ChinaWebDrive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seaony.Kayoi.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KayoiTests:
    build:
      targets:
        KayoiTests: all
    test:
      gatherCoverageData: true
      targets:
        - KayoiTests
  Kayoi:
    build:
      targets:
        Kayoi: all
